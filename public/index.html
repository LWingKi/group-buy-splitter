<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夾團台</title>
<script>try { const t = localStorage.getItem("gb-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=Noto+Sans+HK:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column; the order grid is the hero of each group buy page. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #e8ecea;
  --fg: #17201d;
  --muted: #5d6b66;
  --line: #d4dbd8;
  --accent: #0f7a64;
  --accent-ink: #ffffff;
  --accent-soft: #d9efe9;
  --warn: #9a5b00;
  --warn-soft: #fbedd3;
  --danger: #b3261e;
  --display: "Bricolage Grotesque", "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --sunk: #0d1311; --fg: #e5ecea; --muted: #93a39d;
    --line: #2b3632; --accent: #3cc4a3; --accent-ink: #062019; --accent-soft: #163a31;
    --warn: #f0b45a; --warn-soft: #3a2c14; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --sunk: #0d1311; --fg: #e5ecea; --muted: #93a39d;
  --line: #2b3632; --accent: #3cc4a3; --accent-ink: #062019; --accent-soft: #163a31;
  --warn: #f0b45a; --warn-soft: #3a2c14; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.who b { font-weight: 600; }
.theme-btn { display: inline-flex; align-items: center; gap: 5px; }

/* controls */
input, select, button { font: inherit; color: inherit; }
input[type="text"], input[type="number"], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; min-width: 0; width: 100%;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
input:disabled { background: var(--sunk); color: var(--muted); }
button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; font-weight: 500; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.07); }
button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 6px 8px; }
button.ghost:hover { color: var(--fg); border-color: var(--line); }
button.danger { color: var(--danger); }
button.icon { padding: 4px 8px; line-height: 1; background: none; border-color: transparent; color: var(--muted); font-size: 18px; }
button.icon:hover { color: var(--danger); border-color: var(--line); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 140px; }
.row > input[type="checkbox"] { flex: 0 0 auto; width: auto; margin: 0; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }

/* login */
.login { max-width: 440px; margin: 10vh auto 0; display: grid; gap: 18px; }
.login h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
.login form { display: grid; gap: 10px; }

/* lists of group buys */
.gb-list { display: grid; gap: 10px; }
.gb-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); text-decoration: none; color: inherit; background: var(--bg); }
.gb-card:hover { border-color: var(--accent); }
.gb-card .t { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.gb-card .amt { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 16px; }
.gb-card .sub { font-size: 13px; color: var(--muted); }
.gb-card .sub.r { text-align: right; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; }

/* pills */
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); vertical-align: middle; }
.pill.org { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* group buy header */
.gb-head { display: grid; gap: 10px; }
.gb-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.gb-title input { font-family: var(--display); font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; border-color: transparent; background: none; padding: 2px 6px; margin-left: -7px; flex: 1 1 240px; }
.gb-title input:hover:not(:disabled), .gb-title input:focus { border-color: var(--line); background: var(--surface); }
.gb-title input:disabled { background: none; color: var(--fg); }

/* totals strip */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.totals > div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.totals .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.35rem; }
.totals .me { background: var(--accent-soft); }
.totals .me .v { color: var(--accent); }

/* item / people lists */
.list { display: grid; gap: 6px; }
.li { display: grid; grid-template-columns: 1fr 124px 34px; gap: 6px; align-items: center; }
.li.person { grid-template-columns: 1fr 34px; padding: 6px 4px 6px 10px; border-radius: 8px; background: var(--bg); }
.li .nm { min-width: 0; overflow-wrap: anywhere; }
.price-wrap { position: relative; }
.price-wrap span { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.cur-pick { display: inline-flex; align-items: center; gap: 6px; }
.cur-pick select { width: auto; padding: 3px 8px; font-size: 13px; }
.price-wrap input { padding-left: calc(16px + var(--sym-w, 1ch)); text-align: right; font-family: var(--mono); }
.price-wrap input.pending { border-color: var(--warn); }
.price-wrap input.pending::placeholder { color: var(--warn); }

/* order grid */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-weight: 600; vertical-align: bottom; background: var(--surface); }
th .ip { display: block; font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); }
th .ip.pending { color: var(--warn); font-family: var(--body); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; border-right: 1px solid var(--line); }
td.qty { padding: 4px 6px; }
td.qty input { width: 64px; text-align: right; font-family: var(--mono); padding: 5px 6px; }
td.qty input:disabled { border-color: transparent; background: none; color: var(--fg); }
td.qty input.zero:disabled { color: var(--muted); }
tr.mine td { background: var(--accent-soft); }
tr.mine td:first-child { background: var(--accent-soft); }
.sum-col { border-left: 1px solid var(--line); }
td.total, th.total { font-weight: 600; }
tfoot td { background: var(--bg); font-weight: 600; border-bottom: none; }
tfoot tr:first-child td { border-top: 2px solid var(--line); }
tfoot td:first-child { background: var(--bg); }
tfoot tr.cost td { font-family: var(--mono); font-weight: 500; }
tfoot tr.cost td:first-child { font-family: var(--body); font-weight: 600; }
tfoot td.grand { color: var(--accent); }

.hint { font-size: 13px; color: var(--muted); }
.confirm.warn { color: var(--warn); font-weight: 600; }
.notice.done { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
td.status, th.status-col { text-align: center; }
td.status input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
td.status input:disabled { cursor: default; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
#toast.err { background: var(--danger); color: #fff; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18l-1.5 11a2 2 0 0 1-2 1.7H6.5a2 2 0 0 1-2-1.7L3 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/><path d="M12 11v5M9.5 13.5h5"/></svg>';
const app = document.getElementById("app");
let me = null;
// Colour mode: "auto" follows the device, or force "light" / "dark".
const THEME_LABEL = { auto: "自動", light: "淺色", dark: "深色" };
const THEME_NEXT = { auto: "light", light: "dark", dark: "auto" };
let theme = "auto";
try { theme = localStorage.getItem("gb-theme") || "auto"; } catch {}
if (!THEME_LABEL[theme]) theme = "auto";
const SUN = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const AUTO = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>';
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
}
applyTheme();
function themeButton() {
  const icon = { auto: AUTO, light: SUN, dark: MOON }[theme];
  return `<button class="ghost small theme-btn" type="button" title="轉換顏色模式" aria-label="顏色模式：${THEME_LABEL[theme]}，按一下轉換">${icon}${THEME_LABEL[theme]}</button>`;
}
function wireThemeButton() {
  document.querySelectorAll(".theme-btn").forEach((btn) => btn.onclick = () => {
    theme = THEME_NEXT[theme];
    try { localStorage.setItem("gb-theme", theme); } catch {}
    applyTheme();
    document.querySelectorAll(".theme-btn").forEach((b) => b.outerHTML = themeButton());
    wireThemeButton();
  });
}
try { me = localStorage.getItem("gb-user"); } catch {}
let current = null;     // the group buy being viewed
let pollTimer = null;

// ---------- utilities ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
// Currency code -> [name, symbol]. Yen and won are shown without cents.
const CURRENCIES = {
  HKD: ["港幣", "HK$"], USD: ["美元", "US$"], JPY: ["日圓", "¥"], CNY: ["人民幣", "RMB "],
  KRW: ["韓圜", "₩"], TWD: ["新台幣", "NT$"], GBP: ["英鎊", "£"], EUR: ["歐元", "€"],
  AUD: ["澳元", "A$"], CAD: ["加元", "C$"], SGD: ["新加坡元", "S$"], MYR: ["馬幣", "RM "], THB: ["泰銖", "฿"],
};
const NO_CENTS = ["JPY", "KRW"];
const sym = (code) => CURRENCIES[code] ? CURRENCIES[code][1] : (code || "$");  // older group buys stored a symbol
const symWidth = (code) => `--sym-w:${sym(code).trim().length}ch`;
const money = (cents, code = "HKD") => {
  if (cents == null) return "—";
  const d = NO_CENTS.includes(code) ? 0 : 2;
  return sym(code) + (cents / 100).toLocaleString("zh-HK", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const currencyOptions = (selected) => {
  const opts = Object.entries(CURRENCIES).map(([code, [name, s]]) =>
    `<option value="${code}" ${code === selected ? "selected" : ""}>${code} ${name} (${s.trim()})</option>`);
  if (!CURRENCIES[selected]) opts.unshift(`<option value="" selected disabled>${esc(selected || "$")}（舊設定）</option>`);
  return opts.join("");
};
const plain = (cents, code) => cents == null ? "" : NO_CENTS.includes(code) ? String(Math.round(cents / 100)) : (cents / 100).toFixed(2);

function toast(msg, isErr = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = ""), isErr ? 4200 : 1800);
}

async function call(method, path, body) {
  const res = await fetch("/api" + path, {
    method,
    headers: { "Content-Type": "application/json", ...(me ? { "X-User": encodeURIComponent(me) } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "操作失敗，請再試。");
  return data;
}

// Run a change against the current group buy and re-render with the result.
async function change(method, path, body, okMsg) {
  try {
    current = await call(method, `/groupbuys/${current.id}${path}`, body);
    renderGroupBuy();
    if (okMsg) toast(okMsg);
  } catch (e) { toast(e.message, true); renderGroupBuy(); }
}

// ---------- routing ----------
function route() {
  clearInterval(pollTimer);
  if (!me) return renderLogin();
  const m = location.hash.match(/^#gb-(.+)$/);
  if (m) return openGroupBuy(m[1]);
  renderHome();
}
window.addEventListener("hashchange", route);

function topBar() {
  return `<div class="bar">
    <a class="brand" href="#">${LOGO}夾團台</a>
    <div class="who"><span class="muted">Signed in as</span> <b>${esc(me)}</b>
      <button class="ghost small" id="switch">Switch user</button>${themeButton()}</div>
  </div>`;
}
function wireTopBar() {
  wireThemeButton();
  document.getElementById("switch").onclick = () => {
    me = null; try { localStorage.removeItem("gb-user"); } catch {}
    route();
  };
}

// ---------- login ----------
function renderLogin() {
  app.innerHTML = `<div class="login">
    <div class="bar"><a class="brand" href="#">${LOGO}夾團台</a>${themeButton()}</div>
    <h1>財散人安樂</h1>
    <p class="muted">請輸入你嘅Discord名。呢個將會係你的Account，不需要密碼。</p>
    <form id="login-form">
      <label class="label" for="login-name">Discord name (<@你個名>)</label>
      <input type="text" id="login-name" autocomplete="username" placeholder="e.g. waterfish" maxlength="40" required>
      <button class="primary" type="submit">繼續</button>
    </form>
  </div>`;
  const input = document.getElementById("login-name");
  input.focus();
  wireThemeButton();
  document.getElementById("login-form").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await call("POST", "/login", { username: input.value });
      me = r.username;
      try { localStorage.setItem("gb-user", me); } catch {}
      route();
    } catch (err) { toast(err.message, true); }
  };
}

// ---------- home ----------
function card(g, hosting) {
  const pending = g.pendingPrices ? ` · <span class="pill warn">${g.pendingPrices} 件未定價</span>` : "";
  return `<a class="gb-card" href="#gb-${esc(g.id)}">
    <span class="t">${esc(g.name)}</span>
    <span class="amt">${g.myTotalCents == null ? money(g.grandTotalCents, g.currency) : money(g.myTotalCents, g.currency)}</span>
    <span class="sub">${g.closed ? `<span class="pill done">已完結</span> ` : ""}${hosting ? "" : `團長：${esc(g.organiser)} · `}${g.participantCount} 人 · ${g.itemCount} 款貨品${pending}</span>
    <span class="sub r">${g.myTotalCents == null ? "全單總數" : `你要付 · 全單 ${money(g.grandTotalCents, g.currency)}`}</span>
  </a>`;
}

async function renderHome() {
  app.innerHTML = topBar() + `<p class="muted">載入中…</p>`;
  wireTopBar();
  let data;
  try { data = await call("GET", "/me/groupbuys"); }
  catch (e) { app.innerHTML = topBar() + `<p class="notice">${esc(e.message)}</p>`; wireTopBar(); return; }

  app.innerHTML = topBar() + `
    <form class="panel" id="new-gb">
      <h2>開團</h2>
      <div class="row">
        <input type="text" id="new-name" placeholder="夾團團名 e.g. EN餐車" maxlength="80" required>
        <select id="new-cur" aria-label="貨幣" style="flex:0 1 190px">${currencyOptions("HKD")}</select>
        <button class="primary" type="submit">Create</button>
      </div>
      <label class="row small muted" style="gap:1px"><input type="checkbox" id="new-me" checked> 我有份買</label>
    </form>
    <div class="grid-3">
      <section class="panel">
        <div class="panel-head"><h2>你開嘅團</h2><span class="muted small">${data.hosting.length}</span></div>
        <div class="gb-list">${data.hosting.length ? data.hosting.map((g) => card(g, true)).join("") : `<div class="empty">你未開任何團，如果你想開團，請按＂開團＂</div>`}</div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>你join嘅團</h2><span class="muted small">${data.joined.length}</span></div>
        <div class="gb-list">${data.joined.length ? data.joined.map((g) => card(g, false)).join("") : `<div class="empty">你尚未加入任何團</div>`}</div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>其他夾團</h2><span class="muted small">${data.others.length}</span></div>
        <div class="gb-list">${data.others.length ? data.others.map((g) => card(g, false)).join("") : `<div class="empty">暫時冇其他團</div>`}</div>
      </section>
    </div>`;
  wireTopBar();
  document.getElementById("new-gb").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const gb = await call("POST", "/groupbuys", {
        name: document.getElementById("new-name").value,
        currency: document.getElementById("new-cur").value,
        includeMe: document.getElementById("new-me").checked,
      });
      location.hash = "gb-" + gb.id;
    } catch (err) { toast(err.message, true); }
  };
}

// ---------- group buy ----------
async function openGroupBuy(id) {
  app.innerHTML = topBar() + `<p class="muted">載入中…</p>`;
  wireTopBar();
  try { current = await call("GET", "/groupbuys/" + id); }
  catch (e) { app.innerHTML = topBar() + `<p class="notice">${esc(e.message)} <a href="#">返回我的團購</a></p>`; wireTopBar(); return; }
  renderGroupBuy();
  // Pick up other people's edits, but never while someone is typing.
  pollTimer = setInterval(async () => {
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "SELECT")) return;
    try {
      const fresh = await call("GET", "/groupbuys/" + id);
      if (JSON.stringify(fresh) !== JSON.stringify(current)) { current = fresh; renderGroupBuy(); }
    } catch {}
  }, 5000);
}

function renderGroupBuy() {
  const g = current, s = g.summary, cur = g.currency;
  // orgRole / memberRole say who you are; isOrg / isMember say what you can edit (nothing once closed).
  const closed = !!g.closed;
  const orgRole = g.role === "organiser", memberRole = g.role !== "viewer";
  const isOrg = orgRole && !closed, isMember = memberRole && !closed;
  // The server only sends statuses you may see: all for the organiser, your own for members.
  const st = (u) => g.status?.[u.toLowerCase()] || { paid: false, delivered: false };
  const statusCell = (u, field, first) => {
    const cls = `status${first ? " sum-col" : ""}`;
    const label = field === "paid" ? "已付款" : "已交收";
    if (orgRole) return `<td class="${cls}"><input type="checkbox" class="status-in" data-u="${esc(u)}" data-field="${field}" ${st(u)[field] ? "checked" : ""} ${closed ? "disabled" : ""} aria-label="${esc(u)} ${label}"></td>`;
    if (same(u, me)) return `<td class="${cls}">${st(u)[field] ? `<span class="pill done">${label}</span>` : `<span class="pill">未${label.slice(1)}</span>`}</td>`;
    return `<td class="${cls} muted" title="只有團長同本人睇到">—</td>`;
  };
  const countOf = (field) => g.participants.filter((u) => st(u)[field]).length;
  const canPrice = (it) => isOrg || (isMember && same(it.addedBy || "", me));
  const canQty = (u) => isOrg || (isMember && same(u, me));
  const qty = (u, itemId) => g.quantities[u.toLowerCase()]?.[itemId] || 0;
  const mine = s.people.find((p) => same(p.username, me));
  const splitText = { subtotal: "按每人的貨品金額比例", equal: "由有落單的人平均", items: "按每人購買的件數" }[g.shippingSplit];

  const header = `<div class="gb-head">
    <a href="#" class="small muted">← 所有夾團</a>
    <div class="gb-title">
      <input type="text" id="gb-name" value="${esc(g.name)}" maxlength="80" aria-label="Group buy name" ${isOrg ? "" : "disabled"}>
      <span class="pill ${orgRole ? "org" : ""}">${orgRole ? "你係開團人" : memberRole ? "You joined" : "Viewing"}</span>${closed ? `<span class="pill done">已完結</span>` : ""}
    </div>
    <div class="row small muted">開團人 <b style="color:var(--fg)">${esc(g.organiser)}</b>
      <span class="cur-pick">貨幣 ${isOrg
        ? `<select id="gb-cur" aria-label="更改貨幣">${currencyOptions(cur)}</select>`
        : `<b style="color:var(--fg)">${CURRENCIES[cur] ? `${cur} ${CURRENCIES[cur][0]}` : esc(cur)}</b>`}</span>
      <button class="ghost small" id="copy-link">Copy link</button>
      ${orgRole ? (closed
        ? `<button class="small" id="reopen-gb">重新開放</button>`
        : `<span id="close-slot"><button class="small" id="close-gb">完結團購</button></span>`) : ""}
      ${orgRole ? `<span id="del-slot"><button class="ghost small danger" id="del-gb">Delete group buy</button></span>` : ""}
      ${!memberRole && !closed ? `<button class="primary small" id="join-gb">加入呢個團</button>` : ""}
      ${isMember && !isOrg ? `<span id="leave-slot"><button class="ghost small danger" id="leave-gb">Leave group buy</button></span>` : ""}
    </div>
  </div>`;

  const totals = `<div class="totals">
    <div><span class="label">全單總值</span><span class="v">${money(s.grandTotalCents, cur)}</span></div>
    <div><span class="label">貨品總值</span><span class="v">${money(s.itemsCents, cur)}</span></div>
    <div><span class="label">運費</span><span class="v">${money(s.shippingCents, cur)}</span></div>
    ${mine ? `<div class="me"><span class="label">你要比</span><span class="v">${money(mine.totalCents, cur)}</span><span class="small">${st(me).delivered ? "已交收" : "未交收"} · ${st(me).paid ? "已付款" : "未付款"}</span></div>` : ""}
  </div>`;

  const notices = [];
  const closedBanner = closed
    ? `<p class="notice done">呢個團已經完結${g.closedAt ? `（${new Date(g.closedAt).toLocaleDateString("zh-HK")}）` : ""}，所有資料已鎖定。${orgRole ? "如要修改，請按「重新開放」。" : ""}</p>` : "";
  if (!memberRole && !closed) notices.push(`你未加入呢個團。想一齊夾，請按「加入呢個團」。`);
  if (s.pendingPrices) notices.push(`有 ${s.pendingPrices} 件貨品未定價，暫時不計入總數。團長或加嗰件貨品嘅人可以喺「Item」設定價錢。`);
  if (s.unallocatedShippingCents > 0) notices.push(`暫時未能分攤運費，因為未有人買已定價的貨品。`);

  // Items panel
  const itemsPanel = `<section class="panel">
    <div class="panel-head"><h2>Item</h2><span class="muted small">單價</span></div>
    <div class="list">
      ${g.items.length ? g.items.map((it) => `<div class="li">
        <input type="text" class="item-name" data-id="${esc(it.id)}" value="${esc(it.name)}" aria-label="貨品名稱" ${isMember ? "" : "disabled"}>
        <div class="price-wrap" style="${symWidth(cur)}"><span>${esc(sym(cur))}</span>
          <input type="number" min="0" step="0.01" inputmode="decimal" class="item-price ${it.priceCents == null ? "pending" : ""}" data-id="${esc(it.id)}" value="${plain(it.priceCents, cur)}" placeholder="${canPrice(it) ? "設定" : "待定"}" aria-label="${esc(it.name)} 的單價" ${canPrice(it) ? "" : "disabled"}></div>
        ${canPrice(it) ? `<button class="icon del-item" data-id="${esc(it.id)}" aria-label="移除 ${esc(it.name)}" title="移除貨品">×</button>` : "<span></span>"}
      </div>`).join("") : `<div class="empty">未有貨品，請在下面加入。</div>`}
    </div>
    ${isMember ? `<form class="row" id="add-item">
      <input type="text" id="new-item" placeholder="貨品名稱，例如：Base kit" maxlength="80" required style="flex:2 1 150px">
      ${isMember ? `<div class="price-wrap" style="flex:1 1 90px;${symWidth(cur)}"><span>${esc(sym(cur))}</span><input type="number" id="new-price" min="0" step="0.01" inputmode="decimal" placeholder="0.00" aria-label="單價"></div>` : ""}
      <button type="submit">加入貨品</button>
    </form>
    ${isOrg ? "" : `<p class="hint">你可以加貨品同埋設定價錢。已經有嘅價錢，只有團長或者加嗰件貨品嘅人可以改。</p>`}` : ""}
  </section>`;

  // People panel
  const peoplePanel = `<section class="panel">
    <div class="panel-head"><h2>夾團成員</h2><span class="muted small">${g.participants.length} joined</span></div>
    <div class="list">
      ${g.participants.length ? g.participants.map((u) => `<div class="li person">
        <span class="nm">${esc(u)}${same(u, g.organiser) ? ` <span class="pill org">organiser</span>` : ""}${same(u, me) ? ` <span class="muted small">(you)</span>` : ""}</span>
        ${isOrg || same(u, me) ? `<button class="icon del-person" data-u="${esc(u)}" aria-label="Remove ${esc(u)}" title="Remove from group buy">×</button>` : "<span></span>"}
      </div>`).join("") : `<div class="empty">未冇人入團。要加人請輸入Discord名。</div>`}
    </div>
    ${isMember ? `<form class="row" id="add-person">
      <input type="text" id="new-person" list="user-list" placeholder="Discord 名稱" maxlength="40" required autocomplete="off">
      <datalist id="user-list"></datalist>
      <button type="submit">加人</button>
    </form>` : ""}
  </section>`;

  // Shipping panel
  const shipPanel = `<section class="panel">
    <div class="panel-head"><h2>運費</h2><span class="muted small">for the whole order</span></div>
    <div class="price-wrap" style="${symWidth(cur)}"><span>${esc(sym(cur))}</span>
      <input type="number" id="ship" min="0" step="0.01" inputmode="decimal" value="${plain(g.shippingCents, cur)}" placeholder="0.00" aria-label="Shipping for the whole order" ${isMember ? "" : "disabled"}></div>
    <label class="label" for="split">如何分運費</label>
    <select id="split" ${isMember ? "" : "disabled"}>
      <option value="subtotal" ${g.shippingSplit === "subtotal" ? "selected" : ""}>按貨品金額（買得多，付得多）</option>
      <option value="items" ${g.shippingSplit === "items" ? "selected" : ""}>按件數</option>
      <option value="equal" ${g.shippingSplit === "equal" ? "selected" : ""}>每人平分</option>
    </select>
    <p class="hint">運費${splitText}分攤。每人金額計至仙位，加起來一定等於全單運費。</p>
  </section>`;

  // Order grid
  const grid = g.items.length && g.participants.length ? `<div class="table-scroll"><table>
    <thead><tr>
      <th>夾團人名</th>
      ${g.items.map((it) => `<th>${esc(it.name)}<span class="ip ${it.priceCents == null ? "pending" : ""}">${it.priceCents == null ? "price pending" : money(it.priceCents, cur) + " each"}</span></th>`).join("")}
      <th class="sum-col">Items</th><th>運費</th><th class="total">總數</th>
      <th class="sum-col status-col">已交收</th><th class="status-col">已付款</th>
    </tr></thead>
    <tbody>
      ${s.people.map((p) => `<tr class="${same(p.username, me) ? "mine" : ""}">
        <td>${esc(p.username)}</td>
        ${g.items.map((it) => { const q = qty(p.username, it.id); return `<td class="qty"><input type="number" min="0" step="1" inputmode="numeric" class="qty-in ${q ? "" : "zero"}" data-u="${esc(p.username)}" data-item="${esc(it.id)}" value="${q}" aria-label="${esc(p.username)}: ${esc(it.name)}" ${canQty(p.username) ? "" : "disabled"}></td>`; }).join("")}
        <td class="num sum-col">${money(p.subtotalCents, cur)}</td>
        <td class="num">${money(p.shippingCents, cur)}</td>
        <td class="num total">${money(p.totalCents, cur)}</td>
        ${statusCell(p.username, "delivered", true)}${statusCell(p.username, "paid")}
      </tr>`).join("")}
    </tbody>
    <tfoot>
      <tr><td>總件數</td>${s.items.map((it) => `<td class="num">${it.totalQty}</td>`).join("")}<td class="sum-col"></td><td></td><td></td>
        ${orgRole
          ? `<td class="sum-col status num">${countOf("delivered")}/${g.participants.length}</td><td class="status num">${countOf("paid")}/${g.participants.length}</td>`
          : `<td class="sum-col"></td><td></td>`}</tr>
      <tr class="cost"><td>貨品總金額</td>${s.items.map((it) => `<td>${money(it.totalCents, cur)}</td>`).join("")}
        <td class="sum-col">${money(s.itemsCents, cur)}</td><td>${money(s.shippingCents, cur)}</td><td class="grand">${money(s.grandTotalCents, cur)}</td><td class="sum-col"></td><td></td></tr>
    </tfoot>
  </table></div>
  <p class="hint">${isOrg ? "你是團長，可以更改所有人的數量。" : isMember ? "你只可以更改自己那一行的數量，其他人的已鎖定。" : ""}</p>`
  : `<div class="empty">加入最少一件貨品和一位團員，就可以開始填寫訂單。</div>`;

  app.innerHTML = topBar() + header + closedBanner + totals
    + notices.map((n) => `<p class="notice">${n}</p>`).join("")
    + `<section style="display:grid;gap:10px"><h2>訂單</h2>${grid}</section>`
    + `<div class="grid-3">${itemsPanel}${peoplePanel}${shipPanel}</div>`;
  wireTopBar();
  wireGroupBuy();
}

function wireGroupBuy() {
  const $ = (id) => document.getElementById(id);
  const onCommit = (el, fn) => {
    el.addEventListener("change", fn);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" && el.tagName === "INPUT") el.blur(); });
  };

  const nameEl = $("gb-name");
  if (!nameEl.disabled) onCommit(nameEl, () => change("PATCH", "", { name: nameEl.value }, "已更改名稱"));

  $("copy-link").onclick = async () => {
    const link = location.origin + location.pathname + "#gb-" + current.id;
    try { await navigator.clipboard.writeText(link); toast("已複製連結。對方仍需被加入團購才可參加。"); }
    catch { toast(link); }
  };

  const confirmIn = (slotId, text, action, cls = "") => {
    const slot = $(slotId);
    slot.innerHTML = `<span class="confirm ${cls}">${text} <button class="small danger" id="yes">確定</button><button class="ghost small" id="no">取消</button></span>`;
    slot.querySelector("#no").onclick = renderGroupBuy;
    slot.querySelector("#yes").onclick = action;
  };
  if ($("del-gb")) $("del-gb").onclick = () => confirmIn("del-slot", "確定刪除？所有人都會看不到。", async () => {
    try { await call("DELETE", "/groupbuys/" + current.id); toast("已刪除團購"); location.hash = ""; }
    catch (e) { toast(e.message, true); }
  });
  if ($("close-gb")) $("close-gb").onclick = () => {
    const left = current.participants.filter((u) => !current.status?.[u.toLowerCase()]?.delivered);
    const close = () => change("POST", "/close", {}, "已完結團購");
    if (!left.length) return close();
    confirmIn("close-slot", `⚠ 仲有 ${left.length} 人未交收（${left.map(esc).join("、")}）。確定要完結？`, close, "warn");
  };
  if ($("reopen-gb")) $("reopen-gb").onclick = () => change("POST", "/reopen", {}, "已重新開放");
  document.querySelectorAll(".status-in:not(:disabled)").forEach((el) => el.addEventListener("change", () =>
    change("PUT", "/status", { username: el.dataset.u, [el.dataset.field]: el.checked })));
  if ($("leave-gb")) $("leave-gb").onclick = () => confirmIn("leave-slot", "確定退出？你的訂單會被清除。", async () => {
    try { await call("DELETE", `/groupbuys/${current.id}/participants/${encodeURIComponent(me)}`); toast("你已退出團購"); location.hash = ""; }
    catch (e) { toast(e.message, true); }
  });

  document.querySelectorAll(".qty-in:not(:disabled)").forEach((el) => onCommit(el, () => {
    const v = el.value === "" ? 0 : Number(el.value);
    change("PUT", "/quantities", { username: el.dataset.u, itemId: el.dataset.item, qty: v });
  }));
  document.querySelectorAll(".item-name:not(:disabled)").forEach((el) => onCommit(el, () =>
    change("PATCH", "/items/" + el.dataset.id, { name: el.value })));
  document.querySelectorAll(".item-price:not(:disabled)").forEach((el) => onCommit(el, () =>
    change("PATCH", "/items/" + el.dataset.id, { price: el.value === "" ? null : el.value }, "已儲存價錢")));
  document.querySelectorAll(".del-item").forEach((el) => el.onclick = () => change("DELETE", "/items/" + el.dataset.id, null, "已移除貨品"));
  document.querySelectorAll(".del-person").forEach((el) => el.onclick = () => {
    if (same(el.dataset.u, me) && current.role !== "organiser") return $("leave-gb").click();
    change("DELETE", "/participants/" + encodeURIComponent(el.dataset.u), null, `已移除 ${el.dataset.u}`);
  });

  if ($("gb-cur")) $("gb-cur").addEventListener("change", () => change("PATCH", "", { currency: $("gb-cur").value }, "已更改貨幣"));
  if ($("join-gb")) $("join-gb").onclick = () => change("POST", "/participants", { username: me }, "你已加入呢個團");
  if ($("add-item")) $("add-item").onsubmit = (e) => {
    e.preventDefault();
    const body = { name: $("new-item").value };
    if ($("new-price") && $("new-price").value !== "") body.price = $("new-price").value;
    change("POST", "/items", body, "已加入貨品").then(() => $("new-item")?.focus());
  };
  if ($("add-person")) {
    const input = $("new-person");
    input.addEventListener("input", async () => {
      try {
        const names = await call("GET", "/users?q=" + encodeURIComponent(input.value));
        $("user-list").innerHTML = names.filter((n) => !current.participants.some((p) => same(p, n))).map((n) => `<option value="${esc(n)}">`).join("");
      } catch {}
    });
    $("add-person").onsubmit = (e) => {
      e.preventDefault();
      const u = input.value.trim();
      change("POST", "/participants", { username: u }, `已加入 ${u}`).then(() => $("new-person")?.focus());
    };
  }
  if ($("ship") && !$("ship").disabled) onCommit($("ship"), () => change("PATCH", "", { shipping: $("ship").value || 0 }, "已儲存運費"));
  if ($("split") && !$("split").disabled) $("split").addEventListener("change", () => change("PATCH", "", { shippingSplit: $("split").value }));
}

route();
</script>
</body>
</html>
